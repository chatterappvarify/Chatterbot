<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Chatterbot — ChatterApp AI</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{
  --blue:#29B6F6;
  --blue-dark:#0288D1;
  --blue-deeper:#01579B;
  --blue-light:#E1F5FE;
  --black:#0D1117;
  --grey:#6B7280;
  --light:#F0F9FF;
  --white:#FFFFFF;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--light);}

.app{
  display:flex;flex-direction:column;height:100vh;
  max-width:480px;margin:0 auto;
  background:var(--white);
  box-shadow:0 0 40px rgba(0,0,0,0.08);
  position:relative;overflow:hidden;
}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-dark) 100%);
  padding:16px 20px;
  display:flex;align-items:center;gap:14px;
  box-shadow:0 2px 16px rgba(2,136,209,0.3);
  flex-shrink:0;
}
.header-avatar{
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;border:2px solid rgba(255,255,255,0.4);
}
.header-avatar svg{width:24px;height:24px;}
.header-info{flex:1;}
.header-name{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:#fff;}
.header-status{font-size:12px;color:rgba(255,255,255,0.8);display:flex;align-items:center;gap:5px;margin-top:2px;}
.status-dot{width:7px;height:7px;background:#69f0ae;border-radius:50%;animation:pulse 2s infinite;}
.online-count{font-size:12px;color:rgba(255,255,255,0.7);background:rgba(255,255,255,0.15);padding:4px 10px;border-radius:100px;}

/* MESSAGES */
.messages{
  flex:1;overflow-y:auto;padding:20px 16px;
  display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:4px;}
.messages::-webkit-scrollbar-thumb{background:var(--blue-light);border-radius:4px;}

.date-divider{
  text-align:center;font-size:12px;color:var(--grey);
  margin:4px 0;position:relative;
}
.date-divider::before,.date-divider::after{
  content:'';position:absolute;top:50%;width:30%;height:1px;background:#E5E7EB;
}
.date-divider::before{left:0;}
.date-divider::after{right:0;}

/* BUBBLES */
.msg{display:flex;align-items:flex-end;gap:8px;animation:msgIn .25s ease;}
.msg.bot{align-self:flex-start;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.bot-avatar{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.bot-avatar svg{width:16px;height:16px;}
.bubble{max-width:78%;padding:11px 15px;font-size:14.5px;line-height:1.55;word-break:break-word;}
.msg.bot .bubble{
  background:var(--white);color:var(--black);
  border-radius:18px 18px 18px 4px;
  box-shadow:0 1px 8px rgba(0,0,0,0.08);
  border:1px solid #F0F0F0;
}
.msg.user .bubble{
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  color:#fff;border-radius:18px 18px 4px 18px;
  box-shadow:0 2px 12px rgba(2,136,209,0.3);
}
.msg-time{font-size:10px;margin-top:5px;display:block;opacity:0.6;text-align:right;}
.msg.bot .msg-time{text-align:left;color:var(--grey);}

/* TYPING */
.typing-indicator{display:none;align-items:flex-end;gap:8px;padding:0 16px 8px;flex-shrink:0;}
.typing-indicator.show{display:flex;}
.typing-bubble{
  background:var(--white);border:1px solid #F0F0F0;
  border-radius:18px 18px 18px 4px;
  padding:12px 16px;
  box-shadow:0 1px 8px rgba(0,0,0,0.08);
  display:flex;gap:4px;align-items:center;
}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);opacity:0.4;animation:typingDot 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:.2s;}
.typing-dot:nth-child(3){animation-delay:.4s;}

/* QUICK REPLIES */
.quick-replies{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px;flex-shrink:0;}
.quick-reply{
  background:var(--blue-light);color:var(--blue-dark);
  border:1px solid rgba(2,136,209,0.2);
  border-radius:100px;padding:7px 14px;
  font-size:13px;font-weight:500;cursor:pointer;
  transition:all .2s;white-space:nowrap;
  font-family:'DM Sans',sans-serif;
}
.quick-reply:hover{background:var(--blue);color:#fff;border-color:var(--blue);}

/* INPUT */
.input-area{
  padding:12px 16px 20px;background:var(--white);
  border-top:1px solid #F0F0F0;
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.input-wrap{
  flex:1;display:flex;align-items:center;
  background:var(--light);border:1.5px solid #E5E7EB;
  border-radius:100px;padding:0 16px;transition:border-color .2s;
}
.input-wrap:focus-within{border-color:var(--blue);}
.input-wrap input{
  flex:1;border:none;background:transparent;
  font-family:'DM Sans',sans-serif;font-size:15px;
  color:var(--black);padding:12px 0;outline:none;
}
.input-wrap input::placeholder{color:#9CA3AF;}
.send-btn{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,var(--blue),var(--blue-dark));
  border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(2,136,209,0.35);
  transition:all .2s;flex-shrink:0;
}
.send-btn:hover{transform:scale(1.07);}
.send-btn:active{transform:scale(0.96);}
.send-btn svg{width:20px;height:20px;}

/* Connection banner */
.conn-banner{
  display:none;background:#FF5252;
  color:#fff;font-size:13px;font-weight:500;
  text-align:center;padding:8px;flex-shrink:0;
}
.conn-banner.show{display:block;}

@keyframes msgIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
@keyframes typingDot{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-5px);opacity:1;}}
</style>
</head>
<body>
<div class="app">

  <!-- Connection Banner -->
  <div class="conn-banner" id="connBanner">⚠️ Reconnecting...</div>

  <!-- HEADER -->
  <div class="header">
    <div class="header-avatar">
      <svg viewBox="0 0 24 24" fill="white"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg>
    </div>
    <div class="header-info">
      <div class="header-name">Chatterbot 🤖</div>
      <div class="header-status">
        <span class="status-dot"></span>
        Online · Always here to help
      </div>
    </div>
    <div class="online-count" id="onlineCount">1 online</div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="date-divider">Today</div>
  </div>

  <!-- TYPING INDICATOR -->
  <div class="typing-indicator" id="typingIndicator">
    <div class="bot-avatar">
      <svg viewBox="0 0 24 24" fill="white"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg>
    </div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <!-- QUICK REPLIES -->
  <div class="quick-replies" id="quickReplies"></div>

  <!-- INPUT -->
  <div class="input-area">
    <div class="input-wrap">
      <input type="text" id="msgInput" placeholder="Message Chatterbot..." autocomplete="off"/>
    </div>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
// ─── SOCKET CONNECTION ────────────────────────────────
const socket = io();
const userId = 'user_' + Math.random().toString(36).substr(2,9);

const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('msgInput');
const typingEl   = document.getElementById('typingIndicator');
const quickEl    = document.getElementById('quickReplies');
const countEl    = document.getElementById('onlineCount');
const bannerEl   = document.getElementById('connBanner');

// ─── SOCKET EVENTS ────────────────────────────────────
socket.on('connect', () => {
  bannerEl.classList.remove('show');
});
socket.on('disconnect', () => {
  bannerEl.classList.add('show');
});
socket.on('online_count', count => {
  countEl.textContent = count + ' online';
});
socket.on('bot_typing', (isTyping) => {
  typingEl.classList.toggle('show', isTyping);
  scrollBottom();
});
socket.on('bot_message', (data) => {
  addBotMessage(data.text, data.time);
  if (data.quickReplies) setQuickReplies(data.quickReplies);
});

// ─── HELPERS ──────────────────────────────────────────
function getTime(iso) {
  const d = iso ? new Date(iso) : new Date();
  return d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function addBotMessage(text, time) {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `
    <div class="bot-avatar">
      <svg viewBox="0 0 24 24" fill="white"><path d="M20 2H4C2.9 2 2 2.9 2 4V22L6 18H20C21.1 18 22 17.1 22 16V4C22 2.9 21.1 2 20 2Z"/></svg>
    </div>
    <div class="bubble">${formatText(text)}<span class="msg-time">${getTime(time)}</span></div>
  `;
  messagesEl.appendChild(div);
  scrollBottom();
}

function addUserMessage(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="bubble">${text}<span class="msg-time">${getTime()}</span></div>`;
  messagesEl.appendChild(div);
  scrollBottom();
}

function setQuickReplies(replies) {
  quickEl.innerHTML = '';
  replies.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = r;
    btn.onclick = () => { inputEl.value = r; sendMessage(); };
    quickEl.appendChild(btn);
  });
}

// ─── SEND MESSAGE ─────────────────────────────────────
function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  quickEl.innerHTML = '';
  addUserMessage(text);
  socket.emit('user_message', { text, userId });
}

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
